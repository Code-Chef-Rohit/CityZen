<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424"/>
      <stop offset="100%" stop-color="#0F243E"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#favBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="none" stroke="url(#favCyan)" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Skyline -->
  <rect x="30" y="60" width="14" height="34" rx="2" fill="#0369A1"/>
  <rect x="47" y="48" width="16" height="46" rx="2" fill="#0284C7"/>
  <rect x="65" y="48" width="16" height="46" rx="2" fill="#0284C7"/>
  <rect x="84" y="60" width="14" height="34" rx="2" fill="#0369A1"/>

  <!-- Spire -->
  <rect x="58" y="36" width="12" height="58" rx="2" fill="url(#favCyan)"/>
  <line x1="64" y1="24" x2="64" y2="36" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="64" cy="22" r="5" fill="#FFFFFF"/>

  <!-- Lotus Wings -->
  <path d="M 18 94 C 24 74, 42 60, 62 63 C 50 73, 44 84, 41 98 Z" fill="url(#favOrange)"/>
  <path d="M 110 94 C 104 74, 86 60, 66 63 C 78 73, 84 84, 87 98 Z" fill="url(#favOrange)"/>

  <line x1="22" y1="94" x2="106" y2="94" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
</svg>
