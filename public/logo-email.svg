<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <defs>
    <linearGradient id="emIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424"/>
      <stop offset="50%" stop-color="#0F243E"/>
      <stop offset="100%" stop-color="#0A182A"/>
    </linearGradient>

    <linearGradient id="emCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="emOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <!-- Centered Icon Mark (64x64 at x=168, y=10) -->
  <g transform="translate(168, 8)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#emIconBg)"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#emCyanBlue)" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Left Building -->
    <rect x="17" y="30" width="6" height="16" rx="1" fill="#0369A1"/>
    <rect x="19" y="33" width="2" height="2" fill="#38BDF8"/>
    <rect x="19" y="38" width="2" height="2" fill="#38BDF8"/>

    <!-- Mid-Left Building -->
    <rect x="25" y="24" width="7" height="22" rx="1" fill="#0284C7"/>
    <rect x="27" y="27" width="3" height="3" fill="#FFFFFF"/>
    <rect x="27" y="33" width="3" height="3" fill="#FFFFFF"/>

    <!-- Mid-Right Building -->
    <rect x="34" y="24" width="7" height="22" rx="1" fill="#0284C7"/>
    <rect x="36" y="27" width="3" height="3" fill="#FFFFFF"/>
    <rect x="36" y="33" width="3" height="3" fill="#FFFFFF"/>

    <!-- Right Building -->
    <rect x="43" y="30" width="6" height="16" rx="1" fill="#0369A1"/>
    <rect x="45" y="33" width="2" height="2" fill="#38BDF8"/>
    <rect x="45" y="38" width="2" height="2" fill="#38BDF8"/>

    <!-- Center Spire -->
    <rect x="30" y="18" width="6" height="28" rx="1" fill="url(#emCyanBlue)"/>
    <line x1="33" y1="12" x2="33" y2="18" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="33" cy="11" r="2" fill="#FFFFFF"/>

    <!-- Lotus Wing Accents -->
    <path d="M 11 46 C 14 36, 22 29, 31 31 C 26 36, 23 42, 22 48 Z" fill="url(#emOrange)"/>
    <path d="M 53 46 C 50 36, 42 29, 33 31 C 38 36, 41 42, 42 48 Z" fill="url(#emOrange)"/>

    <line x1="12" y1="46" x2="52" y2="46" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography Centered -->
  <text x="200" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#0F2C59">
    City<tspan fill="#EA580C">Zen</tspan>
  </text>
  <text x="200" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" letter-spacing="3" fill="#0284C7">
    BHUBANESWAR SMART CIVIC NETWORK
  </text>
</svg>
