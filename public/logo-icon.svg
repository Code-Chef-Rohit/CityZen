<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424"/>
      <stop offset="50%" stop-color="#0F243E"/>
      <stop offset="100%" stop-color="#0A182A"/>
    </linearGradient>

    <!-- Royal Cyan & Blue Gradient for City & Tech Elements -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Vibrant Civic Orange Gradient for "Zen" Energy & Lotus Petals -->
    <linearGradient id="zenOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="40%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Soft Shield Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Shield -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" stroke-opacity="0.4"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Radial Aura Glow behind the City Skyline -->
  <circle cx="256" cy="270" r="160" fill="url(#amberGlow)"/>

  <!-- Smart Grid / Connecting Civic Arches -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.4"/>

  <!-- ================= SMART CITY SKYLINE (Center) ================= -->
  <!-- Left Auxiliary Tower -->
  <rect x="135" y="250" width="42" height="110" rx="5" fill="#0369A1" fill-opacity="0.7"/>
  <rect x="145" y="265" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="159" y="265" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="145" y="290" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="159" y="290" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="145" y="315" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="159" y="315" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>

  <!-- Mid-Left Tower -->
  <rect x="187" y="210" width="50" height="150" rx="6" fill="#0284C7" fill-opacity="0.85"/>
  <rect x="198" y="225" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="216" y="225" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="198" y="252" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="216" y="252" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="198" y="280" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="216" y="280" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="198" y="308" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="216" y="308" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Mid-Right Tower -->
  <rect x="275" y="210" width="50" height="150" rx="6" fill="#0284C7" fill-opacity="0.85"/>
  <rect x="286" y="225" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="304" y="225" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="286" y="252" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="304" y="252" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="286" y="280" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="304" y="280" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="286" y="308" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="304" y="308" width="10" height="14" rx="2" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Right Auxiliary Tower -->
  <rect x="335" y="250" width="42" height="110" rx="5" fill="#0369A1" fill-opacity="0.7"/>
  <rect x="345" y="265" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="359" y="265" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="345" y="290" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="359" y="290" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="345" y="315" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>
  <rect x="359" y="315" width="8" height="12" rx="2" fill="#38BDF8" fill-opacity="0.8"/>

  <!-- Central Majestic Spire / Civic Command Nexus -->
  <rect x="238" y="165" width="36" height="195" rx="7" fill="url(#cyanBlueGrad)" filter="url(#softGlow)"/>
  <!-- Central Spire Windows -->
  <circle cx="256" cy="195" r="5" fill="#FFFFFF"/>
  <circle cx="256" cy="220" r="5" fill="#FFFFFF"/>
  <circle cx="256" cy="245" r="5" fill="#FFFFFF"/>
  <circle cx="256" cy="270" r="5" fill="#FFFFFF"/>
  <circle cx="256" cy="295" r="5" fill="#FFFFFF"/>
  <circle cx="256" cy="320" r="5" fill="#FFFFFF"/>

  <!-- Spire Antenna & Smart GPS Node -->
  <line x1="256" y1="120" x2="256" y2="165" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="116" r="14" fill="#38BDF8" fill-opacity="0.3" filter="url(#beaconGlow)"/>
  <circle cx="256" cy="116" r="8" fill="#FFFFFF" filter="url(#softGlow)"/>
  <!-- Radiant Signal Waves from Antenna -->
  <path d="M 238 106 A 22 22 0 0 1 274 106" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M 226 94 A 36 36 0 0 1 286 94" fill="none" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- ================= "ZEN" LOTUS / CIVIC WINGS OF HARMONY ================= -->
  <!-- Left Lotus Wing (C shape foundation) -->
  <path d="M 86 365 C 105 290, 160 230, 235 240 C 200 270, 175 320, 165 375 Z" 
        fill="url(#zenOrangeGrad)" 
        filter="url(#softGlow)"/>
  <!-- Right Lotus Wing (Z shape foundation) -->
  <path d="M 426 365 C 407 290, 352 230, 277 240 C 312 270, 337 320, 347 375 Z" 
        fill="url(#zenOrangeGrad)" 
        filter="url(#softGlow)"/>

  <!-- Central Dynamic Swoosh Uplift (Uniting City & Zen) -->
  <path d="M 120 380 Q 256 430 392 380 C 330 420, 182 420, 120 380 Z" 
        fill="#EA580C" 
        filter="url(#softGlow)"/>

  <!-- Foundation Roadway / Civic Platform -->
  <line x1="110" y1="362" x2="402" y2="362" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="375" x2="372" y2="375" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="12 10" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- ================= STYLIZED INTERTWINED CZ EMBLEM IN SCRIPT ================= -->
  <!-- C Curve Left Badge -->
  <path d="M 175 425 C 150 425, 135 440, 135 455 C 135 470, 150 480, 175 480" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- Z Accent Right Badge -->
  <path d="M 335 430 L 375 430 L 335 475 L 375 475" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8"/>

  <!-- Bottom Crest Label: CITYZEN -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="6" fill="#FFFFFF">
    CITY<tspan fill="#EA580C">ZEN</tspan>
  </text>
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#94A3B8">
    BHUBANESWAR SMART CITY
  </text>
</svg>
