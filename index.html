<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CityZen" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>CityZen — One City. One App.</title>
    <meta name="description" content="AI-Powered Smart City Companion for Bhubaneswar. Live Services, Emergency SOS, BMC Grievances & Healthcare Grid." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Open Graph / Facebook / WhatsApp / Discord / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CityZen" />
    <meta property="og:url" content="https://cityzen-one.netlify.app/" />
    <meta property="og:title" content="CityZen — One City. One App." />
    <meta property="og:description" content="AI-Powered Municipal Operating System for Bhubaneswar. Live Services, Emergency SOS, BMC Grievance Redressal & Healthcare Network." />
    <meta property="og:image" content="https://cityzen-one.netlify.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://cityzen-one.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CityZen — Bhubaneswar Smart Civic Network" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://cityzen-one.netlify.app/" />
    <meta name="twitter:title" content="CityZen — One City. One App." />
    <meta name="twitter:description" content="AI-Powered Municipal Operating System for Bhubaneswar. Live Services, Emergency SOS, BMC Grievance Redressal & Healthcare Network." />
    <meta name="twitter:image" content="https://cityzen-one.netlify.app/og-image.png" />
    <meta name="twitter:image:alt" content="CityZen — Bhubaneswar Smart Civic Network" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <style>
      html.dark, html.dark body {
        background-color: #030712 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
